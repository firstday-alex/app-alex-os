[build]
  publish = "public"
  functions = "netlify/functions"
  # No build command on purpose. This is plain ESM with no compile step: Netlify just
  # publishes public/ and bundles the functions. A no-op build command is a thing that
  # can fail for no benefit, and it did.

[functions]
  node_bundler = "esbuild"
  # src/ and config/ are read at runtime by the functions. Bundle them in.
  included_files = ["config/**", "skills/**", "src/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[dev]
  framework = "#static"
  publish = "public"
