[build]
  publish = "public"
  functions = "netlify/functions"
  # An explicit command that cannot fail. There is no compile step here, but leaving
  # build.command unset does not mean "do nothing": Netlify's framework detection picks a
  # command on our behalf, and a guessed `npm run build` against a package.json with no
  # build script exits non-zero. Saying "do nothing" out loud is not the same as silence.
  command = "echo 'no build step: plain ESM, nothing to compile'"

[functions]
  node_bundler = "esbuild"
  # src/ and config/ are read at runtime by the functions. Bundle them in.
  included_files = ["config/**", "skills/**", "src/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[dev]
  framework = "#static"
  publish = "public"
